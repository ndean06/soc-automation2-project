# SOC Automation 2.0 - sanitized n8n Docker Compose example
# Copy .env.example to .env, replace its placeholders, and keep .env private.

services:
  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:1.119.2}
    container_name: soc-automation-n8n
    restart: unless-stopped

    ports:
      - "${N8N_PORT:-5678}:5678"

    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Toronto}
      - TZ=${TZ:-America/Toronto}
      # false is suitable only for this isolated HTTP lab.
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}

    volumes:
      - ${N8N_DATA_PATH:-./n8n_data}:/home/node/.n8n
